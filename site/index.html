<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KuttuBot — Find movies &amp; series, get them in Telegram</title>
<meta name="description" content="Search movies and series, see posters and details, and get the files in Telegram with one tap. KuttuBot by Goutham Josh.">
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KuttuBot">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f5b83d'/%3E%3Cpath d='M20 14h8v14l12-14h10L36 31l15 19H40L28 35v15h-8z' fill='%231a1203'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b10; --bg2:#101017; --surface:#15151d; --surface2:#1c1c26; --line:#272733;
  --text:#f3f1ea; --muted:#a09eab; --accent:#f5b83d; --accent-ink:#1a1203; --accent-text:#f5b83d;
  --danger:#ff7a7a; --ok:#6fd39a; --shadow:0 18px 50px rgba(0,0,0,.45);
  --r:14px; --gutter:clamp(16px,4vw,40px);
  --head:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#faf8f3; --bg2:#f3f0e8; --surface:#ffffff; --surface2:#f1ede3; --line:#e4dfd2;
    --text:#17150f; --muted:#6a665a; --accent-text:#9a5b00; --shadow:0 18px 40px rgba(60,45,10,.14);
  }
}
:root[data-theme="light"]{
  --bg:#faf8f3; --bg2:#f3f0e8; --surface:#ffffff; --surface2:#f1ede3; --line:#e4dfd2;
  --text:#17150f; --muted:#6a665a; --accent-text:#9a5b00; --shadow:0 18px 40px rgba(60,45,10,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.55 var(--body);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding:0 var(--gutter)}

/* ── header ── */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;position:relative;box-shadow:0 6px 18px rgba(245,184,61,.28)}
.mark::before,.mark::after{content:"";position:absolute;top:50%;width:8px;height:8px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.mark::before{left:-4px}.mark::after{right:-4px}
.mark svg{width:20px;height:20px;fill:var(--accent-ink)}
.brand b{display:block;font:700 18px/1.1 var(--head);letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.hsearch{display:none}
.field{position:relative}
.field input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 44px 0 46px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:var(--muted)}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.field .ic{position:absolute;left:16px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.field .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.field .x:hover{background:var(--surface2)}
.actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;font:600 14px/1 var(--body);transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn svg{width:17px;height:17px;flex:none}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 22px rgba(245,184,61,.25)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(245,184,61,.36)}
.btn.pri:active{transform:none}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}
.btn.ghost:hover{border-color:var(--accent)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:640px){.brand small{display:none}.btn .lbl{display:none}.btn.pri{padding:0 12px}.bar{gap:10px}}

/* ── hero ── */
.hero{position:relative;padding:clamp(40px,9vw,92px) 0 clamp(26px,5vw,44px);text-align:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-20% -10% auto;height:120%;background:
  radial-gradient(60% 55% at 50% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),
  radial-gradient(40% 40% at 85% 20%,color-mix(in srgb,#7a5cff 16%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 12.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:999px;padding:8px 14px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
h1.title{font:800 clamp(34px,6.4vw,66px)/1.04 var(--head);letter-spacing:-.035em;margin:20px auto 14px;max-width:15ch}
h1.title em{font-style:normal;color:var(--accent-text)}
.sub{color:var(--muted);max-width:52ch;margin:0 auto 28px;font-size:clamp(15px,2vw,18px)}
.hero .field{max-width:640px;margin:0 auto}
.hero .field input{height:58px;font-size:17px;padding-left:54px;box-shadow:var(--shadow)}
.hero .field .ic{left:20px;width:21px;height:21px}
.hero .steps{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 26px;margin-top:26px;color:var(--muted);font-size:14px}
.hero .steps span{display:inline-flex;align-items:center;gap:9px}
.hero .steps b{width:22px;height:22px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font:700 11.5px/1 var(--head);color:var(--text)}

/* ── filters ── */
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px var(--gutter) 6px;margin:0 calc(var(--gutter)*-1);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 13.5px/1 var(--body);transition:all .15s}
.chip:hover{color:var(--text);border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.fsep{flex:none;width:1px;background:var(--line);margin:6px 4px}

/* ── grid ── */
main{flex:1}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 16px}
.sechead h2{font:700 clamp(20px,3vw,26px)/1.2 var(--head);letter-spacing:-.02em}
.sechead span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:clamp(14px,2vw,24px)}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{display:block;position:relative;border-radius:var(--r);transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.poster{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--surface2);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.poster img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s,transform .5s}
.poster img.on{opacity:1}
.card:hover .poster img{transform:scale(1.05)}
.poster .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:linear-gradient(160deg,var(--c1),var(--c2));color:#fff}
.poster .ph b{font:700 17px/1.15 var(--head);letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.35);overflow-wrap:anywhere}
.poster .ph small{opacity:.8;font-size:12px;margin-top:4px}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 38%);opacity:0;transition:opacity .2s;pointer-events:none}
.card:hover .poster::after{opacity:1}
.rate{position:absolute;top:9px;left:9px;z-index:2;display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:rgba(10,10,14,.72);backdrop-filter:blur(8px);color:#fff;font:600 12px/1 var(--body)}
.rate::before{content:"★";color:var(--accent)}
.kind{position:absolute;top:9px;right:9px;z-index:2;padding:4px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:700 10.5px/1 var(--body);letter-spacing:.05em;text-transform:uppercase}
.meta{padding:10px 2px 0}
.meta b{display:block;font:600 14.5px/1.3 var(--head);letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta span{color:var(--muted);font-size:13px}
.loadnote{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--muted);font-size:14px;margin:0 0 16px}
.loadnote .spin{flex:none;width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel .poster{border:0;background:linear-gradient(100deg,var(--surface2) 30%,var(--surface) 50%,var(--surface2) 70%);background-size:300% 100%;animation:sh 1.3s infinite linear;box-shadow:none}
.skel .line{height:12px;border-radius:6px;margin-top:11px;background:var(--surface2);width:80%}
.skel .line.s{width:40%;height:10px;margin-top:8px}
@keyframes sh{to{background-position:-100% 0}}
.more{display:flex;justify-content:center;padding:34px 0 10px}
.state{display:grid;place-items:center;text-align:center;gap:10px;padding:64px 16px;color:var(--muted)}
.state .big{font:700 22px/1.2 var(--head);color:var(--text)}
.state .em{font-size:44px;line-height:1}

/* ── movie page ── */
.movie{position:relative;isolation:isolate}
.backdrop{position:absolute;inset:0 0 auto;height:min(560px,70vh);z-index:-1;overflow:hidden}
.backdrop img{width:100%;height:100%;object-fit:cover;filter:blur(38px) saturate(1.3);transform:scale(1.3);opacity:.34}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0,var(--bg) 96%)}
.crumb{display:inline-flex;align-items:center;gap:8px;margin:22px 0 6px;color:var(--muted);font-weight:500;font-size:14px;height:40px;padding:0 14px 0 8px;border-radius:999px}
.crumb:hover{color:var(--text);background:var(--surface)}
.crumb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mhead{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:clamp(22px,4vw,48px);align-items:start;padding:10px 0 34px}
@media (max-width:760px){.mhead{grid-template-columns:1fr;gap:20px;justify-items:center;text-align:center}.mposter{width:min(58vw,230px)}.facts,.genres,.cta{justify-content:center}.plot{text-align:left}}
.mposter{aspect-ratio:2/3;border-radius:18px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;width:100%}
.mposter button{display:block;width:100%;height:100%}
.mposter img{width:100%;height:100%;object-fit:cover}
.mposter .zoom{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(10,10,14,.7);display:grid;place-items:center;color:#fff;backdrop-filter:blur(6px)}
.mposter .zoom svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.info h1{font:800 clamp(28px,4.6vw,48px)/1.08 var(--head);letter-spacing:-.03em}
.facts{display:flex;flex-wrap:wrap;gap:8px 10px;margin:14px 0;align-items:center;color:var(--muted);font-size:14.5px}
.facts .pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-weight:500;font-size:13.5px}
.facts .pill.r::before{content:"★";color:var(--accent)}
.genres{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.genres span{font-size:13px;color:var(--accent-text);border:1px solid color-mix(in srgb,var(--accent) 38%,var(--line));padding:5px 12px;border-radius:999px}
.plot{color:var(--muted);max-width:68ch;font-size:16px}
.plot.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.plotbtn{margin-top:6px;color:var(--accent-text);font-weight:600;font-size:14px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.cta .btn{height:46px;padding:0 20px;font-size:15px}

.files{padding-bottom:40px}
.files .sechead{margin-top:6px}
.flist{display:grid;gap:10px;margin-top:14px}
.file{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 16px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.file:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.file .nm{font:500 14.5px/1.45 var(--body);overflow-wrap:anywhere;word-break:break-word}
.file .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font:600 11.5px/1 var(--body);padding:5px 8px;border-radius:7px;background:var(--surface2);color:var(--muted);letter-spacing:.02em}
.tag.q{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text)}
.fgroup{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.fgroup .lbl{font:600 11.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.season{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.season h3{font:700 19px/1.2 var(--head);letter-spacing:-.01em}
.season span{color:var(--muted);font-size:13px}
.file .sz{color:var(--muted);font-size:13px;white-space:nowrap}
.file .go{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:560px){.file{grid-template-columns:1fr}.file .go{grid-row:auto;grid-column:auto;flex-direction:row;justify-content:space-between;align-items:center}.file .go .btn{flex:1}}
.note{margin-top:22px;padding:14px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--muted);font-size:14px;display:flex;gap:10px}
.note b{color:var(--text)}


/* ── bottom tab bar (mobile) / pill row (desktop) ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;align-items:center;height:calc(68px + env(safe-area-inset-bottom));padding:0 8px env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:64px;min-height:48px;font:600 11px/1 var(--body);color:var(--muted)}
.tabs a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--accent-text)}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
.toast{bottom:calc(84px + env(safe-area-inset-bottom))}
@media (min-width:761px){
  .tabs{position:sticky;top:64px;bottom:auto;height:auto;justify-content:center;gap:8px;padding:12px 0;background:color-mix(in srgb,var(--bg) 85%,transparent);border:0;z-index:25}
  .tabs a{flex-direction:row;gap:8px;min-height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
  .tabs a svg{width:18px;height:18px}
  .tabs a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  body{padding-bottom:0}
  .toast{bottom:24px}
}

/* ── home: featured carousel + numbered rail ── */
.compact-search{padding:18px 0 0}
.compact-search .field input{height:52px;font-size:16px}
.feat{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:18px calc(var(--gutter)*-1) 0;padding:0 var(--gutter)}
.feat::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;max-width:560px;scroll-snap-align:center;position:relative;min-height:220px;border-radius:24px;overflow:hidden;background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;display:flex;align-items:flex-end;padding:18px}
@media (min-width:761px){.slide{flex-basis:520px;min-height:250px}}
.slide .txt{position:relative;z-index:1;max-width:calc(100% - 96px)}
.slide small{display:block;font:600 12px/1 var(--body);letter-spacing:.1em;opacity:.85}
.slide h3{font:800 26px/1.1 var(--head);letter-spacing:-.02em;margin:8px 0 6px}
.slide p{font-size:13px;opacity:.85;margin-bottom:12px}
.slide .go{display:inline-flex;align-items:center;height:42px;padding:0 18px;border-radius:12px;background:#fff;color:#1b1030;font:700 13px/1 var(--head)}
.slide .sp{position:absolute;right:16px;bottom:16px;width:80px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
.slide .sp img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.slide .sp img.on{opacity:1}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:all .2s}
.dots i.on{width:18px;background:var(--accent)}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--gutter)*-1);padding:2px var(--gutter) 6px}
.rail::-webkit-scrollbar{display:none}
.rcard{flex:none;display:flex;align-items:flex-end;width:158px}
.rcard .n{font:800 78px/.78 var(--head);color:var(--bg);-webkit-text-stroke:2px var(--accent);margin-right:-16px;position:relative;z-index:1;pointer-events:none}
.rcard .poster{width:104px;flex:none;border-radius:12px}
.rcard:hover{transform:none}

/* ── lightbox ── */
.lb{position:fixed;inset:0;z-index:60;background:rgba(5,5,8,.9);display:grid;place-items:center;padding:20px;backdrop-filter:blur(6px)}
.lb img{max-width:min(94vw,640px);max-height:88vh;border-radius:14px;box-shadow:var(--shadow)}
.lb button{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}

/* ── footer / toast ── */
footer{border-top:1px solid var(--line);margin-top:40px;padding:28px 0 40px;color:var(--muted);font-size:14px;background:var(--bg2)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:center}
footer b{color:var(--text);font-family:var(--head)}
footer a{color:var(--accent-text);font-weight:500}
footer a:hover{text-decoration:underline}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:70;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-view="home">

<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#/" aria-label="KuttuBot home">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 3h3.4v7.2L14.2 3h4.4l-6.2 7.7L19.4 21h-4.5l-5.2-7.4-1.3 1.6V21H5z"/></svg></span>
      <span><b>KuttuBot</b><small>by Goutham Josh</small></span>
    </a>
    <form class="hsearch field" role="search" id="hform" aria-hidden="true">
      <label class="sr" for="hq">Search movies and series</label>
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="hq" type="search" placeholder="Search movies or series…" autocomplete="off" enterkeyhint="search">
      <button type="button" class="x" id="hx" aria-label="Clear search" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </form>
    <div class="actions">
      <a class="icon-btn" id="sIcon" href="#/search" aria-label="Search" title="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></a>
      <button class="icon-btn" id="theme" aria-label="Toggle light / dark theme" title="Theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
      <a class="btn pri" id="tgTop" href="https://telegram.dog/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3L18.6 19.6c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6.3 12.9 1.4 11.4c-1.1-.3-1.1-1 .2-1.5L20.5 2.6c.9-.3 1.7.2 1.4 1.7z"/></svg>
        <span class="lbl">Open in Telegram</span>
      </a>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Main">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg><span>Home</span></a>
  <a href="#/movies" data-tab="movies"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14M16 5v14"/></svg><span>Movies</span></a>
  <a href="#/series" data-tab="series"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 21h6M12 18v3"/></svg><span>Series</span></a>
  <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search</span></a>
</nav>


<main>
  <!-- HOME + SEARCH -->
  <section id="browse">
    <div class="wrap compact-search" id="hero" hidden>
      <form class="field" role="search" id="form">
        <label class="sr" for="q">Search movies and series</label>
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Try “Leo”, “Kaithi”, “Money Heist”…" autocomplete="off" enterkeyhint="search">
        <button type="button" class="x" id="x" aria-label="Clear search" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </form>
    </div>

    <div class="wrap">
      <div id="homeTop" hidden>
        <div class="feat" id="feat" aria-label="Featured"></div>
        <div class="dots" id="dots" aria-hidden="true"></div>
        <div class="sechead"><h2>Newest additions</h2></div>
        <div class="rail" id="rail"></div>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Filters" hidden></div>
      <div class="sechead"><h2 id="sectitle">Latest uploads</h2><span id="secsub"></span></div>
      <div class="grid" id="grid" aria-live="polite"></div>
      <div class="state" id="state" hidden></div>
      <div class="more" id="more" hidden><button class="btn ghost" id="moreBtn">Load more</button></div>
      <div id="sentinel" style="height:1px"></div>
    </div>
  </section>

  <!-- MOVIE -->
  <section id="movie" class="movie" hidden>
    <div class="backdrop" id="backdrop" aria-hidden="true"></div>
    <div class="wrap">
      <a class="crumb" id="back" href="#/"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Back</a>
      <div id="mbody"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div><b>KuttuBot</b> · built by <a href="https://gouthamjosh.vercel.app" target="_blank" rel="noopener">Goutham Josh</a></div>
    <div>Files are delivered by our Telegram bot. <a id="tgFoot" href="https://telegram.dog/" target="_blank" rel="noopener">Open the bot</a> · <a href="#" id="installBtn" hidden>Install app</a></div>
  </div>
</footer>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const el = {
    body: document.body, hero: $('#hero'), q: $('#q'), hq: $('#hq'), x: $('#x'), hx: $('#hx'),
    form: $('#form'), hform: $('#hform'), filters: $('#filters'), grid: $('#grid'), state: $('#state'),
    more: $('#more'), moreBtn: $('#moreBtn'), sentinel: $('#sentinel'), title: $('#sectitle'), sub: $('#secsub'),
    browse: $('#browse'), movie: $('#movie'), mbody: $('#mbody'), backdrop: $('#backdrop'), toast: $('#toast'),
    homeTop: $('#homeTop'), feat: $('#feat'), dots: $('#dots'), rail: $('#rail'), tabs: $('#tabs'), tgTop: $('#tgTop'), tgFoot: $('#tgFoot'), theme: $('#theme'), back: $('#back'),
  };

  const QUALITY = ['480p', '720p', '1080p', '4K'];
  const LANGS = ['Tamil', 'Telugu', 'Hindi', 'Malayalam', 'Kannada', 'English'];
  const state = { query: '', lang: '', quality: '', next: null, loading: false, seq: 0, mseq: 0, movies: new Map(), total: 0, bot: '', scroll: 0, from: 'home', tab: 'home', loadedTab: null, top: new Set() };
  const TAB_HASH = { home: '#/', movies: '#/movies', series: '#/series', search: '#/search' };
  const tabFromHash = h => ({ '#/movies': 'movies', '#/series': 'series', '#/search': 'search' }[h] || 'home');
  const tabKind = () => state.tab === 'movies' ? 'movie' : state.tab === 'series' ? 'series' : '';
  const TAB_TITLE = { home: 'Just added', movies: 'Movies', series: 'Series', search: 'Latest uploads' };

  /* ── helpers ── */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let toastT;
  const toast = msg => { el.toast.textContent = msg; el.toast.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.toast.classList.remove('on'), 2400); };
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const effectiveQuery = () => [state.tab === 'search' ? state.query : '', state.lang, state.quality].filter(Boolean).join(' ');
  const fileTags = name => {
    const out = [];
    const q = name.match(/\b(2160p|4k|1080p|720p|480p|360p)\b/i); if (q) out.push([q[1].toLowerCase() === '2160p' ? '4K' : q[1].toUpperCase().replace('P', 'p'), 1]);
    const src = name.match(/\b(web[\s-]?dl|webrip|hdrip|bluray|brrip|hdtv|dvdrip|hdcam|camrip|predvd)\b/i); if (src) out.push([src[1].replace(/\s|-/g, '').toUpperCase().replace('WEBDL', 'WEB-DL'), 0]);
    const codec = name.match(/\b(x265|hevc|h 265|x264|h 264|av1)\b/i); if (codec) out.push([/265|hevc/i.test(codec[1]) ? 'HEVC' : /av1/i.test(codec[1]) ? 'AV1' : 'x264', 0]);
    langsOf(name).slice(0, 3).forEach(l => out.push([l, 0]));
    if (/\b(dual|multi)\b/i.test(name)) out.push(['Dual Audio', 0]);
    const sn = seasonOf(name); if (sn) out.push(['S' + pad2(sn) + (episodeOf(name) ? ' E' + pad2(episodeOf(name)) : ' Pack'), 0]);
    if (/\b(esub|e sub|subs?)\b/i.test(name)) out.push(['Subs', 0]);
    if (/\bsrt\s*$/i.test(name)) out.push(['Subtitle', 0]);
    return out;
  };
  const LANG_MAP = { malayalam: 'Malayalam', mal: 'Malayalam', tamil: 'Tamil', tam: 'Tamil', telugu: 'Telugu', tel: 'Telugu', hindi: 'Hindi', hin: 'Hindi',
    english: 'English', eng: 'English', kannada: 'Kannada', kan: 'Kannada', bengali: 'Bengali', marathi: 'Marathi', punjabi: 'Punjabi' };
  const LANG_RE = /\b(malayalam|mal|tamil|tam|telugu|tel|hindi|hin|english|eng|kannada|kan|bengali|marathi|punjabi)\b/gi;
  const langsOf = name => [...new Set((name.match(LANG_RE) || []).map(w => LANG_MAP[w.toLowerCase()]))];
  const qualityOf = name => { const q = name.match(/\b(2160p|4k|1080p|720p|480p|360p)\b/i); return q ? (/^(2160p|4k)$/i.test(q[1]) ? '4K' : q[1].toLowerCase()) : ''; };
  const seasonOf = name => {
    const m = name.match(/\bS(\d{1,2})(?=[\s._-]*(?:EP?(?:isode)?[\s._-]*\d|\b))/i) || name.match(/\bseason[\s._-]*(\d{1,2})\b/i);
    return m ? parseInt(m[1], 10) : 0;
  };
  const episodeOf = name => {
    const m = name.match(/\bS\d{1,2}[\s._-]*EP?(?:isode)?[\s._-]*(\d{1,3})\b/i) || name.match(/\bep(?:isode)?[\s._-]*(\d{1,3})\b/i);
    return m ? parseInt(m[1], 10) : 0;      // 0 = whole-season pack
  };
  const pad2 = n => String(n).padStart(2, '0');
  const api = async (url, opts) => {
    let r;
    try { r = await fetch(url, opts); } catch { throw new Error('No connection. Check your internet and try again.'); }
    let j = null; try { j = await r.json(); } catch {}
    if (!r.ok || !j || j.ok === false) throw new Error((j && j.error) || 'Something went wrong. Please try again.');
    return j;
  };
  const tgLink = (path = '') => `https://telegram.dog/${state.bot}${path}`;

  /* ── poster ── */
  function posterHTML(m, big) {
    const h = hue(m.title), src = big ? (m.poster || m.thumb) : m.thumb;
    const ph = `<div class="ph" style="--c1:hsl(${h} 48% 30%);--c2:hsl(${(h + 50) % 360} 55% 16%)"><b>${esc(m.title)}</b><small>${esc(m.year || '')}</small></div>`;
    return ph + (src ? `<img alt="${esc(m.title)} poster" ${big ? '' : 'loading="lazy"'} decoding="async" src="${esc(src)}">` : '');
  }
  function wireImgs(root) {
    root.querySelectorAll('img').forEach(img => {
      const ok = () => { img.classList.add('on'); const ph = img.parentElement.querySelector('.ph'); if (ph) ph.hidden = true; };
      img.addEventListener('load', ok, { once: true });
      img.addEventListener('error', () => img.remove(), { once: true });
      if (img.complete && img.naturalWidth) ok();
    });
  }

  /* ── "still loading" note: shown after a short delay (no flash on fast loads), wording grows with the wait ── */
  function loadNote(place, msgs) {
    const n = document.createElement('div'); n.className = 'loadnote'; n.setAttribute('role', 'status');
    n.innerHTML = '<span class="spin" aria-hidden="true"></span><span></span>';
    const txt = n.lastChild, t0 = Date.now();
    const set = () => { const w = Date.now() - t0; txt.textContent = w > 12000 ? msgs[2] : w > 4000 ? msgs[1] : msgs[0]; };
    set();
    const show = setTimeout(() => { place(n); }, 300);
    const tick = setInterval(set, 1000);
    return () => { clearTimeout(show); clearInterval(tick); n.remove(); };
  }
  const GRID_MSGS = ['Loading titles… posters can take a few seconds to appear.', 'Still fetching posters, thanks for waiting.', 'Taking longer than usual. The server may be busy or waking up, please hang tight.'];
  const MOVIE_MSGS = ['Loading poster and files… this can take a few seconds.', 'Still fetching details and files, thanks for waiting.', 'Taking longer than usual. The server may be busy, please wait or reload the page.'];
  let stopGridNote = null, stopMovieNote = null;

  /* ── home top: featured slides + numbered rail ── */
  function slideHTML(m) {
    const h = hue(m.title);
    return `<a class="slide" href="${movieHref(m)}" style="--c1:hsl(${h} 50% 32%);--c2:hsl(${(h + 60) % 360} 55% 18%)" aria-label="${esc(m.title)}">
      <div class="txt"><small>${m.kind === 'series' ? 'SERIES' : 'MOVIE'}</small><h3>${esc(m.title)}</h3><p>${esc([m.year, m.rating ? '★ ' + Number(m.rating).toFixed(1) : ''].filter(Boolean).join(' · ') || 'New on KuttuBot')}</p><span class="go">View details</span></div>
      ${m.thumb ? `<div class="sp"><img alt="" decoding="async" src="${esc(m.thumb)}"></div>` : ''}</a>`;
  }
  function renderTop(items) {
    if (!items.length) { el.homeTop.hidden = true; return; }
    const feat = items.slice(0, 3);
    el.feat.innerHTML = feat.map(slideHTML).join('');
    el.dots.innerHTML = feat.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('');
    el.dots.hidden = feat.length < 2;
    el.rail.innerHTML = items.slice(0, 6).map((m, i) => `<a class="card rcard" href="${movieHref(m)}" aria-label="${i + 1}. ${esc(m.title)}"><span class="n" aria-hidden="true">${i + 1}</span><div class="poster">${m.kind === 'series' ? '<span class="kind">Series</span>' : ''}${posterHTML(m)}</div></a>`).join('');
    wireImgs(el.feat); wireImgs(el.rail);
    el.homeTop.hidden = false;
  }
  el.feat.addEventListener('scroll', () => {
    const w = el.feat.firstElementChild ? el.feat.firstElementChild.getBoundingClientRect().width : 1;
    const i = Math.round(el.feat.scrollLeft / (w + 12));
    [...el.dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
  }, { passive: true });

  /* ── grid ── */
  const movieHref = m => '#/m/' + encodeURIComponent(JSON.stringify({ k: m.keys, q: m.qs, t: m.title, y: m.year, kd: m.kind }));
  function cardHTML(m) {
    return `<a class="card" href="${movieHref(m)}" aria-label="${esc(m.title)} ${esc(m.year || '')}">
      <div class="poster">${m.rating ? `<span class="rate">${Number(m.rating).toFixed(1)}</span>` : ''}${m.kind === 'series' ? '<span class="kind">Series</span>' : ''}${posterHTML(m)}</div>
      <div class="meta"><b>${esc(m.title)}</b><span>${esc(m.year || (m.kind === 'series' ? 'Series' : 'Movie'))}</span></div></a>`;
  }
  const skeletons = n => Array.from({ length: n }, () => '<div class="card skel"><div class="poster"></div><div class="line"></div><div class="line s"></div></div>').join('');
  function showState(html) { el.state.innerHTML = html; el.state.hidden = !html; }

  async function load(append) {
    if (state.loading && append) return;
    syncView();
    const seq = ++state.seq; state.loading = true;
    const q = effectiveQuery();
    if (!append) {
      state.movies.clear(); state.next = null; state.total = 0; state.top.clear(); state.chain = 0;
      state.loadedTab = state.tab; el.homeTop.hidden = true;
      el.grid.innerHTML = skeletons(12); showState(''); el.more.hidden = true;
      if (stopGridNote) stopGridNote();
      stopGridNote = loadNote(n => el.grid.before(n), GRID_MSGS);
      el.title.textContent = (state.tab === 'search' && state.query) ? `Results for “${state.query}”` : TAB_TITLE[state.tab]; el.sub.textContent = '';
    }
    try {
      const j = await api(`/api/search?q=${encodeURIComponent(q)}&offset=${append ? state.next : 0}`);
      if (seq !== state.seq) return;
      const fresh = [], kd = tabKind();
      for (const m of j.movies) {
        if (kd && m.kind !== kd) continue;
        const have = state.movies.get(m.mkey);
        if (have) { have.keys = [...new Set([...have.keys, ...m.keys])]; have.qs = [...new Set([...have.qs, ...m.qs])]; continue; }
        state.movies.set(m.mkey, m); fresh.push(m);
      }
      state.next = j.next_offset; state.total = j.total;
      if (!append) el.grid.innerHTML = '';
      let shown = fresh;
      if (!append && state.tab === 'home') {                        // first page on Home: top items go to the featured slides + rail
        const topItems = fresh.slice(0, 6); topItems.forEach(m => state.top.add(m.mkey));
        renderTop(topItems); shown = fresh.slice(6);
      }
      el.grid.insertAdjacentHTML('beforeend', shown.map(cardHTML).join(''));
      wireImgs(el.grid);
      el.more.hidden = state.next === null;
      if (!state.movies.size) {
        showState(state.next === null
          ? `<div class="em">🎞️</div><div class="big">Nothing found</div><div>Check the spelling, or try a shorter name${state.lang || state.quality ? ' and clear the filters' : ''}.</div>`
          : '');
        if (state.next !== null) { state.loading = false; return load(true); }
      }
      if (state.tab !== 'home' && state.next !== null && el.grid.children.length < 8 && state.chain++ < 6) { state.loading = false; return load(true); }   // kind filter can leave a page nearly empty
      el.sub.textContent = state.movies.size ? `${state.movies.size} title${state.movies.size === 1 ? '' : 's'}${state.next !== null ? '+' : ''}` : '';
    } catch (e) {
      if (seq !== state.seq) return;
      if (!append) el.grid.innerHTML = '';
      showState(`<div class="em">⚠️</div><div class="big">Couldn’t load</div><div>${esc(e.message)}</div><button class="btn pri" id="retry">Try again</button>`);
      const r = $('#retry'); if (r) r.onclick = () => load(append);
    } finally {
      if (seq === state.seq) { state.loading = false; if (stopGridNote) { stopGridNote(); stopGridNote = null; } }
    }
  }

  /* ── filters ── */
  function renderFilters() {
    const chip = (kind, v, label) => `<button class="chip" data-k="${kind}" data-v="${esc(v)}" aria-pressed="${state[kind] === v}">${esc(label || v)}</button>`;
    el.filters.innerHTML = chip('quality', '', 'All quality')
      + QUALITY.map(v => chip('quality', v)).join('') + '<span class="fsep"></span>'
      + chip('lang', '', 'All languages') + LANGS.map(v => chip('lang', v)).join('');
  }
  el.filters.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const k = b.dataset.k, v = b.dataset.v;
    state[k] = state[k] === v ? '' : v;
    renderFilters(); load(false);
  });

  /* ── search inputs (hero + header share state) ── */
  let typing;
  const runSearch = () => { if (location.hash === '#/search') load(false); else go('#/search'); };
  function setQuery(v, run) {
    state.query = v.trim();
    if (el.q.value !== v) el.q.value = v;
    if (el.hq.value !== v) el.hq.value = v;
    el.x.hidden = el.hx.hidden = !v;
    if (run) { clearTimeout(typing); typing = setTimeout(runSearch, 380); }
  }
  [el.q, el.hq].forEach(i => i.addEventListener('input', () => setQuery(i.value, true)));
  [el.form, el.hform].forEach(f => f.addEventListener('submit', e => { e.preventDefault(); clearTimeout(typing); document.activeElement.blur(); runSearch(); }));
  [el.x, el.hx].forEach(b => b.addEventListener('click', () => { setQuery('', false); runSearch(); el.q.focus(); }));

  /* ── load more ── */
  el.moreBtn.onclick = () => load(true);
  new IntersectionObserver(es => { if (es[0].isIntersecting && state.next !== null && !state.loading && !el.browse.hidden) load(true); }, { rootMargin: '700px' }).observe(el.sentinel);

  /* ── movie page ── */
  const go = h => { if (location.hash !== h && !(h === '#/' && !location.hash)) location.hash = h; };
  let lightbox;
  function openLightbox(src) {
    closeLightbox();
    lightbox = document.createElement('div'); lightbox.className = 'lb'; lightbox.setAttribute('role', 'dialog'); lightbox.setAttribute('aria-label', 'Poster');
    lightbox.innerHTML = `<img alt="Poster" src="${esc(src)}"><button aria-label="Close poster">✕</button>`;
    lightbox.onclick = closeLightbox; document.body.appendChild(lightbox); lightbox.querySelector('button').focus();
  }
  function closeLightbox() { if (lightbox) { lightbox.remove(); lightbox = null; } }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  el.back.addEventListener('click', e => { if (state.fromBrowse) { e.preventDefault(); state.fromBrowse = false; history.back(); } });

  const prefetched = new Map();      // movie hash -> promise, filled on hover / touch so the page opens instantly
  function prefetch(card) {
    const h = card.getAttribute('href');
    if (prefetched.has(h) || prefetched.size > 12) return;
    let ref; try { ref = JSON.parse(decodeURIComponent(h.slice(4))); } catch { return; }
    const pr = movieRequest(ref); pr.catch(() => prefetched.delete(h)); prefetched.set(h, pr);
    setTimeout(() => prefetched.delete(h), 45000);
  }
  const movieRequest = ref => api('/api/movie', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keys: ref.k, qs: ref.q }) });
  ['pointerenter', 'touchstart'].forEach(ev => el.grid.addEventListener(ev, e => { const c = e.target.closest && e.target.closest('.card[href]'); if (c) prefetch(c); }, { passive: true, capture: true }));

  async function showMovie(ref) {
    const seq = ++state.mseq;
    el.mbody.innerHTML = `<div class="mhead"><div class="mposter"></div><div class="info"><h1>${esc(ref.t || 'Loading…')}</h1><div class="facts"><span>${esc(ref.y || '')}</span></div></div></div>
      <div class="files"><div class="flist">${'<div class="file skel" style="height:78px"></div>'.repeat(3)}</div></div>`;
    el.backdrop.innerHTML = '';
    document.title = `${ref.t || 'Movie'} — KuttuBot`;
    if (stopMovieNote) stopMovieNote();
    stopMovieNote = loadNote(n => el.mbody.prepend(n), MOVIE_MSGS);
    try {
      const j = await (prefetched.get(location.hash) || movieRequest(ref));
      if (seq !== state.mseq) return;
      renderMovie(ref, j);
    } catch (e) {
      if (seq !== state.mseq) return;
      el.mbody.innerHTML = `<div class="state"><div class="em">⚠️</div><div class="big">Couldn’t load this title</div><div>${esc(e.message)}</div><button class="btn pri" id="retry">Try again</button></div>`;
      $('#retry').onclick = () => showMovie(ref);
    } finally {
      if (seq === state.mseq && stopMovieNote) { stopMovieNote(); stopMovieNote = null; }
    }
  }

  function renderMovie(ref, j) {
    const info = j.info;
    if (!info || !j.files.length) {
      el.mbody.innerHTML = `<div class="state"><div class="em">🎞️</div><div class="big">No files for this title yet</div><div>It may have been removed. Go back and search again.</div></div>`;
      return;
    }
    document.title = `${info.title}${info.year ? ' (' + info.year + ')' : ''} — KuttuBot`;
    const poster = info.poster || info.thumb;
    if (poster) { el.backdrop.innerHTML = `<img alt="" src="${esc(info.thumb || poster)}">`; }
    const isSeries = info.kind === 'series';
    const files = j.files.slice();
    if (isSeries) files.sort((a, b) => seasonOf(a.name) - seasonOf(b.name) || episodeOf(a.name) - episodeOf(b.name) || a.name.localeCompare(b.name));
    const plot = info.plot || '';
    const words = (info.title || ref.t || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 52);
    const allLink = tgLink(`?start=getfile-${words}`);
    el.mbody.innerHTML = `
      <div class="mhead">
        <div class="mposter">${poster ? `<button id="zoom" aria-label="View full poster">${posterHTML({ title: info.title, year: info.year, poster: info.poster, thumb: info.thumb }, true)}<span class="zoom"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></span></button>` : posterHTML({ title: info.title, year: info.year })}</div>
        <div class="info">
          <h1>${esc(info.title)}</h1>
          <div class="facts">
            ${info.year ? `<span class="pill">${esc(info.year)}</span>` : ''}
            <span class="pill">${info.kind === 'series' ? 'Series' : 'Movie'}</span>
            ${info.runtime ? `<span class="pill">${esc(info.runtime)}</span>` : ''}
            ${info.rating ? `<span class="pill r">${Number(info.rating).toFixed(1)} / 10</span>` : ''}
          </div>
          ${info.genres && info.genres.length ? `<div class="genres">${info.genres.slice(0, 5).map(g => `<span>${esc(g)}</span>`).join('')}</div>` : ''}
          ${plot ? `<p class="plot ${plot.length > 230 ? 'clamp' : ''}" id="plot">${esc(plot)}</p>${plot.length > 230 ? '<button class="plotbtn" id="plotbtn">Read more</button>' : ''}` : ''}
          <div class="cta">
            <a class="btn pri" href="${esc(allLink)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3L18.6 19.6c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6.3 12.9 1.4 11.4c-1.1-.3-1.1-1 .2-1.5L20.5 2.6c.9-.3 1.7.2 1.4 1.7z"/></svg>Open in Telegram</a>
            <button class="btn ghost" id="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Share</button>
          </div>
        </div>
      </div>
      <div class="files">
        <div class="sechead"><h2>Files</h2><span id="fcount">${j.files.length} available</span></div>
        <div class="fgroup" id="fgroup"></div>
        <div class="flist" id="flist"></div>
        <div class="note"><span>💡</span><span><b>How it works:</b> tap <b>Get on Telegram</b>. The bot opens and sends you the file. Press <b>Start</b> if it’s your first time. Files are removed from your chat after a few minutes, so save or forward them.</span></div>
      </div>`;
    wireImgs(el.mbody);
    const list = $('#flist');
    const sel = { season: 0, quality: '', lang: '' };
    const order = ['4K', '1080p', '720p', '480p', '360p'];
    const groups = [
      { k: 'season', label: 'Season', vals: isSeries ? [...new Set(files.map(f => seasonOf(f.name)))].filter(Boolean).sort((x, y) => x - y) : [], text: v => 'S' + pad2(v) },
      { k: 'quality', label: 'Quality', vals: [...new Set(files.map(f => qualityOf(f.name)).filter(Boolean))].sort((x, y) => order.indexOf(x) - order.indexOf(y)), text: v => v },
      { k: 'lang', label: 'Language', vals: [...new Set(files.flatMap(f => langsOf(f.name)))].sort(), text: v => v },
    ].filter(g => g.vals.length > 1);
    $('#fgroup').innerHTML = groups.map(g => `<span class="lbl">${g.label}</span><div class="filters" data-k="${g.k}" role="group" aria-label="Filter by ${g.label.toLowerCase()}">
      <button class="chip" data-v="" aria-pressed="true">All</button>${g.vals.map(v => `<button class="chip" data-v="${esc(v)}" aria-pressed="false">${esc(g.text(v))}</button>`).join('')}</div>`).join('');
    const rowHTML = f => {
      const tags = fileTags(f.name).map(t => `<span class="tag ${t[1] ? 'q' : ''}">${esc(t[0])}</span>`).join('');
      return `<div class="file"><div><div class="nm">${esc(f.name)}</div>${tags ? `<div class="tags">${tags}</div>` : ''}</div>
        <div class="go"><span class="sz">${esc(f.size)}</span><a class="btn pri" href="${esc(tgLink('?start=wf_' + f.id))}" target="_blank" rel="noopener">Get on Telegram</a></div></div>`;
    };
    const draw = () => {
      const rows = files.filter(f => (!sel.season || seasonOf(f.name) === sel.season) && (!sel.quality || qualityOf(f.name) === sel.quality) && (!sel.lang || langsOf(f.name).includes(sel.lang)));
      $('#fcount').textContent = rows.length === files.length ? `${files.length} available` : `${rows.length} of ${files.length}`;
      if (!rows.length) { list.innerHTML = '<div class="state"><div class="big">No files match</div><div>Try another filter.</div></div>'; return; }
      const grouped = isSeries && !sel.season && new Set(rows.map(f => seasonOf(f.name))).size > 1;
      let last = null, html = '';
      for (const f of rows) {
        if (grouped) {
          const sn = seasonOf(f.name);
          if (sn !== last) { last = sn; const n = rows.filter(x => seasonOf(x.name) === sn).length; html += `<div class="season"><h3>${sn ? 'Season ' + sn : 'Other files'}</h3><span>${n} file${n === 1 ? '' : 's'}</span></div>`; }
        }
        html += rowHTML(f);
      }
      list.innerHTML = html;
    };
    draw();
    $('#fgroup').addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      const box = b.parentElement, k = box.dataset.k;
      sel[k] = k === 'season' ? (b.dataset.v ? Number(b.dataset.v) : 0) : b.dataset.v;
      box.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
      draw();
    });
    const z = $('#zoom'); if (z) z.onclick = () => openLightbox(info.poster || info.thumb);
    const pb = $('#plotbtn'); if (pb) pb.onclick = () => { const p = $('#plot'); const c = p.classList.toggle('clamp'); pb.textContent = c ? 'Read more' : 'Show less'; };
    $('#share').onclick = async () => {
      const link = shortUrl(ref);
      const data = { title: info.title, text: `${info.title}${info.year ? ' (' + info.year + ')' : ''} on KuttuBot`, url: link };
      try { if (navigator.share) { await navigator.share(data); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(link); toast('Link copied'); } catch { toast('Copy the address bar link to share'); }
    };
  }

  /* ── short share links: /m/the-paradise-2026 (movie), /s/money-heist (series) ── */
  const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const normKey = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '');
  function shortUrl(ref) {
    const k0 = (ref.k && ref.k[0]) || '', slug = slugify((ref.q && ref.q[0]) || '');
    if (!slug) return location.href;                         // title has no latin letters: keep the long link
    const series = !k0.includes('|'), year = series ? '' : k0.split('|')[1];
    return `${location.origin}/${series ? 's' : 'm'}/${slug}${year ? '-' + year : ''}`;
  }
  // slug -> the same {k, q, t, y, kd} a card would carry. Searches once so every filename variant of the title is included.
  async function refFromSlug(kind, slug) {
    const words = s => s.replace(/-/g, ' ').trim(), cap = s => s.replace(/\b[a-z]/g, c => c.toUpperCase());
    const cands = [];
    if (kind === 's') cands.push({ title: words(slug), key: normKey(slug) });
    else {
      const ym = slug.match(/^(.+)-((?:19|20)\d{2})$/);
      if (ym) cands.push({ title: words(ym[1]), key: normKey(ym[1]) + '|' + ym[2], year: ym[2] });
      cands.push({ title: words(slug), key: normKey(slug) + '|', year: '' });      // a title that really ends in a year ("Blade Runner 2049")
    }
    for (const c of cands) {
      try {
        const j = await api('/api/search?q=' + encodeURIComponent(c.title) + '&offset=0');
        const m = j.movies.find(x => x.keys.includes(c.key));
        if (m) return { k: m.keys, q: m.qs, t: m.title, y: m.year, kd: m.kind };
      } catch {}
    }
    const c = cands[0];
    return { k: [c.key], q: [cap(c.title)], t: cap(c.title), y: c.year || '', kd: kind === 's' ? 'series' : 'movie' };
  }

  /* ── routing ── */
  function route() {
    closeLightbox();
    const h = location.hash;
    if (h.startsWith('#/m/')) {
      let ref = null;
      try { ref = JSON.parse(decodeURIComponent(h.slice(4))); } catch {}
      if (!ref || !Array.isArray(ref.k) || !Array.isArray(ref.q)) { location.hash = '#/'; return; }
      if (el.body.dataset.view !== 'movie') { state.scroll = window.scrollY; state.fromBrowse = true; }
      el.body.dataset.view = 'movie'; el.browse.hidden = true; el.movie.hidden = false;
      el.tabs.querySelectorAll('a').forEach(a => a.removeAttribute('aria-current'));
      window.scrollTo(0, 0);
      showMovie(ref);
    } else {
      const wasMovie = el.body.dataset.view === 'movie';
      state.mseq++;      // drop a movie response that arrives after leaving the page
      if (stopMovieNote) { stopMovieNote(); stopMovieNote = null; }
      const tab = tabFromHash(h);
      el.movie.hidden = true; el.browse.hidden = false;
      document.title = 'KuttuBot — Find movies & series, get them in Telegram';
      const changed = state.tab !== tab || state.loadedTab !== tab;
      state.tab = tab;
      if (changed) { load(false); window.scrollTo(0, 0); if (tab === 'search') setTimeout(() => el.q.focus(), 60); }
      else { syncView(); if (tab === 'search' && !wasMovie) el.q.focus(); }
      if (wasMovie) requestAnimationFrame(() => window.scrollTo(0, state.scroll));
    }
  }
  const syncView = () => {
    if (el.browse.hidden) return;
    const t = state.tab;
    el.body.dataset.view = t;
    el.hero.hidden = t !== 'search';
    el.filters.hidden = t === 'home';
    if (t !== 'home') el.homeTop.hidden = true;
    el.tabs.querySelectorAll('a').forEach(a => a.toggleAttribute('aria-current', a.dataset.tab === t && el.body.dataset.view !== 'movie'));
    el.tabs.querySelectorAll('a').forEach(a => { if (a.hasAttribute('aria-current')) a.setAttribute('aria-current', 'page'); });
  };
  window.addEventListener('hashchange', route);

  /* ── theme ── */
  const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
  applyTheme(store.get('kb-theme'));
  el.theme.onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    const next = cur === 'dark' ? 'light' : 'dark'; applyTheme(next); store.set('kb-theme', next);
  };

  /* ── install app (PWA) ── */
  let deferredInstall = null;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; installBtn.hidden = false; });
  installBtn.addEventListener('click', async (e) => {
    e.preventDefault();
    if (!deferredInstall) return;
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch {}
    deferredInstall = null; installBtn.hidden = true;
  });
  window.addEventListener('appinstalled', () => { installBtn.hidden = true; });
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));

  /* ── boot ── */
  (async function init() {
    renderFilters();
    try { const c = await api('/api/config'); state.bot = c.bot || ''; } catch {}
    const link = tgLink(); el.tgTop.href = link; el.tgFoot.href = link;
    const sm = location.pathname.match(/^\/([ms])\/([a-z0-9-]+)\/?$/);
    if (sm) {                                                 // opened a short link: resolve it, then continue as a normal movie page
      el.body.dataset.view = 'movie'; el.browse.hidden = true; el.movie.hidden = false;
      el.mbody.innerHTML = '<div class="state"><div class="big">Opening…</div></div>';
      const ref = await refFromSlug(sm[1], sm[2]);
      history.replaceState(null, '', '/#/m/' + encodeURIComponent(JSON.stringify(ref)));
    }
    state.tab = tabFromHash(location.hash.startsWith('#/m/') ? '' : location.hash);
    route();
    if (state.loadedTab === null) load(false);
  })();
})();
</script>
</body>
